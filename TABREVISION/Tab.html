<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive tabs</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="tabMenu">
            <ul>
                <l1><a href="#tab1">Tab 1</a></l1>
                <l1><a href="#tab2">Tab 2</a></l1>
                <l1><a href="#tab3">Tab 3</a></l1>
            </ul>
        </div>
        <div class="tabContent">
            <div id="tab1">
                <h2>Tab 1 content</h2>
                <p>This is the content of tab 1.</p>
            </div>
            <div id="tab2">
                <h2>Tab 2 content</h2>
                <p>This is the content of tab 2.</p>
            </div>
            <div id="tab3">
                <h2>Tab 3 content</h2>
                <p>This is the content of tab 3.</p>
            </div>
        </div>
    </div>
</body>
</html>

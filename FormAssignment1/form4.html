<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
</head>
<body>
    <table width="15%" style="border-collapse: collapse; border: 1px solid black;" >
        <tr height="30">
            <td colspan="4" style="border: 1px solid black;">&nbsp;</td>
        </tr>
        <tr>
            <td style="border: 1px solid black;">&nbsp;</td>
            <td>&nbsp;</td>
            <td>&nbsp;</td>
            <td>&nbsp;</td>
        </tr>
        <tr>
            <td style="border: 1px solid black;">&nbsp;</td>
            <td>&nbsp;</td>
            <td>&nbsp;</td>
            <td>&nbsp;</td>
        </tr>
        <tr>
            <td style="border: 1px solid black;">&nbsp;</td>
            <td>&nbsp;</td>
            <td>&nbsp;</td>
            <td>&nbsp;</td>
        </tr>
        <tr>
            <td style="border: 1px solid black;">&nbsp;</td>
            <td>&nbsp;</td>
            <td>&nbsp;</td>
            <td>&nbsp;</td>
        </tr>
        <tr>
            <td style="border: 1px solid black;">&nbsp;</td>
            <td>&nbsp;</td>
            <td>&nbsp;</td>
            <td>&nbsp;</td>
        </tr>
        <tr>
            <td style="border: 1px solid black;">&nbsp;</td>
            <td>&nbsp;</td>
            <td>&nbsp;</td>
            <td>&nbsp;</td>
        </tr>
        <tr>
            <td style="border: 1px solid black;">&nbsp;</td>
            <td>&nbsp;</td>
            <td>&nbsp;</td>
            <td>&nbsp;</td>
        </tr>
    </table>
    <br/>
    <table cellpadding="5" style="border-collapse: collapse; border: 1px solid black;">
        <tr bgcolor="yellow">
            <td style="border: 1px solid black;">Cell[1,1]</td>
            <td colspan="2" style="border: 1px solid black;">Cell[2,1]</td>
            
        </tr>
        <tr bgcolor="orange">
            <td style="border: 1px solid black;">Cell[1,2]</td>
            <td rowspan="2" align="center" style="border: 1px solid black;">Cell[2,2]</td>
            <td style="border: 1px solid black;">Cell[3,2]</td>
        </tr>
        <tr bgcolor="sky blue">
            <td style="border: 1px solid black;">Cell[1,3]</td>
            <td style="border: 1px solid black;">Cell[2,3]</td>
        </tr>
    </table>
</body>
</html>
